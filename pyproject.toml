[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euchre-bot"
version = "0.1.0"
description = "A reinforcement-learning playground built around the card game Euchre."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# The deep-learning stack is only needed once you start implementing the
# learning agents in euchre_bot.algos. The engine, env, and baselines run
# without it.
learn = [
    "torch>=2.0",
]
# Experiment monitoring. This project uses MLflow (free, open-source, local --
# no account or server). MetricsLogger logs params, metrics, and artifacts to
# MLflow; browse with `mlflow ui`. It is optional: without it, logging still
# goes to stdout and runs/<name>/metrics.jsonl. See docs/monitoring.md.
monitor = [
    "mlflow>=2.9",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
euchre-play = "euchre_bot.play:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
